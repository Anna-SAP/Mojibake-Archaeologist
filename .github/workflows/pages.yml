name: Deploy GitHub Pages

# Every push to main (including merged PRs) redeploys the site; it can also be re-run by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # The app is plain classic scripts with no build step, so a syntax check is the gate
      # that keeps a broken file from going live.
      - name: Syntax check
        run: |
          for f in src/*.js; do
            node --check "$f"
          done

      # Publish only what the browser needs; tests, docs and tools stay in the repo.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets src _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
